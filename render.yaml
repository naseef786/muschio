services:
  # ---------------------------------------------------------------------------
  # MUSCHIO API — Production Node.js & Express REST Backend
  # ---------------------------------------------------------------------------
  - type: web
    name: muschio-api
    runtime: node
    plan: free
    region: frankfurt # Strategic low latency to GCC (UAE/KSA) and Europe
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @muschio/types build && pnpm --filter @muschio/api build
    startCommand: pnpm --filter @muschio/api start
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      
      # Allowed Origins (Storefront, Admin, and local dev)
      - key: CORS_ORIGIN
        value: https://muschio.vercel.app,https://muschio-admin.vercel.app,http://localhost:3000,http://localhost:5173
      - key: STOREFRONT_URL
        value: https://muschio.vercel.app
      
      # Database connection (Neon / PostgreSQL)
      # In Render Dashboard, paste your Neon DATABASE_URL with ?sslmode=require
      - key: DATABASE_URL
        sync: false

      # Authentication & Scheduler Secrets (Auto-generated by Render)
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true

      # Commerce & Payments Configuration
      - key: PAYMENTS_ENABLED
        value: "false"
      - key: PAYMENT_PROVIDER
        value: stripe

      # Cloudflare R2 Media Storage Configuration
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: muschio-media
      - key: R2_PUBLIC_DOMAIN
        value: https://media.muschio.luxury
